<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Poker Table Positions</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: a lit card table in a dark club room; controls above, seat details beside (stacks on phones) */
:root{
  color-scheme: dark;
  --room:#0E1113; --panel:#171B1E; --panel-2:#1E2327; --line:#2A3035;
  --ink:#F2EDE3; --muted:#A9A398;
  --felt:#1F5240; --felt-deep:#133528; --rail:#231A15;
  --gold:#E8C14F; --early:#7D96E6; --middle:#4FB5A5; --blinds:#E3876A;
  --good:#5CC28A; --bad:#EA6F62;
  --display:"Oswald", "Arial Narrow", Arial, sans-serif;
  --body:"Barlow", "Segoe UI", Helvetica, Arial, sans-serif;
}
html,body{height:auto}
body{background:var(--room);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 40px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header img{width:72px;height:60px;object-fit:contain}
header .t{display:flex;flex-direction:column;min-width:0}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--display);font-weight:600;font-size:clamp(30px,4.4vw,48px);line-height:1.05;text-transform:uppercase;margin:0;text-wrap:balance;letter-spacing:.01em}

.controls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.group > .lbl{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;background:var(--room);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;font-family:var(--display);font-size:16px;font-weight:600;min-width:30px;text-align:center;padding:6px 10px;border-radius:7px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);color:#16130A}
.seg button:hover:not([aria-pressed="true"]){color:var(--ink);background:var(--panel-2)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;font-weight:700;font-size:15px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);color:#16130A;border-color:var(--gold)}
.btn[disabled]{opacity:.45;cursor:default}
:is(button,.btn,input):focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.spacer{flex:1}
.num{box-sizing:border-box;width:86px;background:var(--room);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-family:var(--display);font-size:17px;font-weight:600;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.num::-webkit-inner-spin-button{opacity:.4}
.field{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600}

.main{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}

/* Table */
.table{position:relative;aspect-ratio:16/10;width:100%;max-width:100%}
@media (max-width:640px){.table{aspect-ratio:1/1.12}}
.rail{position:absolute;inset:13% 9%;border-radius:999px;background:var(--rail);box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 0 0 2px #3A2C22}
.felt{position:absolute;inset:15.5% 11.2%;border-radius:999px;background:radial-gradient(ellipse at 50% 42%, #2A6A52 0%, var(--felt) 45%, var(--felt-deep) 100%);box-shadow:inset 0 0 40px rgba(0,0,0,.45)}
.felt::after{content:"";position:absolute;inset:9% 7%;border-radius:999px;border:2px solid rgba(242,237,227,.16)}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:clamp(4px,.8vw,10px);width:52%}
.felt-logo{width:clamp(30px,5.4vw,66px);height:auto;opacity:.5}
.street{font-family:var(--display);font-weight:600;font-size:clamp(11px,1.4vw,16px);letter-spacing:.2em;text-transform:uppercase;color:rgba(242,237,227,.72)}
.board{display:flex;gap:clamp(3px,.6vw,8px)}
.card{all:unset;box-sizing:border-box;cursor:pointer;width:clamp(22px,3.9vw,46px);aspect-ratio:5/7;border-radius:5px;border:1.5px dashed rgba(242,237,227,.45);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(9px,1.4vw,16px);line-height:1;color:rgba(242,237,227,.6);transition:transform .15s ease, opacity .2s ease}
.card:hover{transform:translateY(-3px)}
.card.up{background:#F2EDE3;border:1.5px solid #F2EDE3;color:#14171A}
.card.up.red{color:#C0392B}
.card.later{opacity:.28}
.card.later.up{opacity:.4}
.boardgap{width:clamp(2px,.5vw,6px)}

/* Card picker */
.picker{position:fixed;inset:0;background:rgba(5,6,7,.72);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px))}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;width:min(640px,100%);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.sheet h3{margin:0;font-family:var(--display);font-weight:600;font-size:22px;text-transform:uppercase}
.deck{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:4px}
.pc{all:unset;box-sizing:border-box;cursor:pointer;aspect-ratio:5/7;border-radius:5px;background:#F2EDE3;color:#14171A;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:clamp(10px,2.4vw,16px);line-height:1.05}
.pc.red{color:#C0392B}
.pc:hover{outline:2px solid var(--gold)}
.pc[disabled]{opacity:.18;cursor:default;outline:none}
.pc.cur{outline:3px solid var(--gold)}
.picker[hidden]{display:none}
.sel{background:var(--room);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-family:var(--display);font-size:17px;font-weight:600;color:var(--ink)}
.btn.ghost{background:transparent}
.btn.ghost[aria-expanded="true"]{border-color:var(--gold);color:var(--gold)}
.setup{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:-8px}
.setup[hidden]{display:none}
.tablebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tog{all:unset;cursor:pointer;font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tog[aria-pressed="true"]{background:var(--ink);color:#14171A;border-color:var(--ink)}
.phead{display:flex;gap:14px;align-items:center}
.phead > div{display:flex;flex-direction:column;gap:6px;min-width:0}
.sec{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.about summary{cursor:pointer;font-weight:700;color:var(--muted);font-size:14px}
.about[open] summary{margin-bottom:8px}
/* Hole cards */
.hole{position:absolute;transform:translate(-50%,-50%);display:flex;gap:2px;z-index:1}
.hc{all:unset;box-sizing:border-box;cursor:pointer;width:clamp(15px,2.3vw,28px);aspect-ratio:5/7;border-radius:3px;background:#F2EDE3;color:#14171A;font-weight:700;font-size:clamp(7px,.95vw,12px);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 2px 5px rgba(0,0,0,.45)}
.hc.red,.cl.red{color:#C0392B}
.hc.back,.cl.back{background:repeating-linear-gradient(45deg,#3F56A8 0 3px,#2E428A 3px 6px);border:1.5px solid #F2EDE3;color:transparent}
.hc.empty,.cl.empty{background:transparent;border:1.5px dashed rgba(242,237,227,.5);color:rgba(242,237,227,.7);box-shadow:none}
.hole.dim{opacity:.35}
.win{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:var(--good);color:#14171A;font-size:clamp(8px,.85vw,10px);font-weight:700;padding:1px 6px;border-radius:999px;letter-spacing:.08em;white-space:nowrap}
.holeRow{display:flex;gap:10px;align-items:center}
.cl{all:unset;box-sizing:border-box;cursor:pointer;width:52px;aspect-ratio:5/7;border-radius:6px;background:#F2EDE3;color:#14171A;font-weight:700;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.cl:hover,.hc:hover{outline:2px solid var(--gold)}
.besthand{display:flex;flex-direction:column;gap:2px;min-width:0}
.besthand .v{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.15}
.besthand .k{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pot{font-family:var(--display);font-weight:600;font-size:clamp(12px,1.6vw,20px);color:var(--ink);background:rgba(0,0,0,.38);padding:1px 14px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pot span{color:var(--gold)}

.seat{all:unset;box-sizing:border-box;cursor:pointer;position:absolute;transform:translate(-50%,-50%);
  width:clamp(50px,8.6vw,92px);aspect-ratio:1;border-radius:50%;background:var(--panel);
  border:3px solid var(--c, var(--line));display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 8px 20px rgba(0,0,0,.45);transition:transform .2s ease, background .2s ease, box-shadow .2s ease, opacity .2s ease}
.seat .pos{font-family:var(--display);font-weight:600;font-size:clamp(13px,1.9vw,22px);line-height:1;color:var(--ink)}
.seat .grp{font-size:clamp(8px,.9vw,11px);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
@media (max-width:640px){.seat .grp{display:none}.seat .pos{font-size:12px}.seat{width:48px}}
.seat:hover{transform:translate(-50%,-50%) scale(1.06)}
.seat.selected{background:var(--c);}
.seat.selected .pos,.seat.selected .grp{color:#14171A}
.seat.folded{opacity:.35}
.seat.acting{box-shadow:0 0 0 5px rgba(232,193,79,.9), 0 0 34px rgba(232,193,79,.7);transform:translate(-50%,-50%) scale(1.1)}
.seat.right{background:var(--good);border-color:var(--good)}
.seat.wrong{background:var(--bad);border-color:var(--bad)}
.seat.right .pos,.seat.wrong .pos,.seat.right .grp,.seat.wrong .grp{color:#14171A}
.order{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;border-radius:12px;background:var(--ink);color:#14171A;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.chip{position:absolute;transform:translate(-50%,-50%);width:clamp(20px,2.8vw,30px);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:clamp(8px,1vw,11px);box-shadow:0 3px 6px rgba(0,0,0,.45)}
.chip.d{background:#F2EDE3;color:#14171A;border:2px dashed #14171A}
.bet{all:unset;cursor:pointer;position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;background:rgba(10,12,14,.8);border-radius:999px;padding:2px 9px 2px 2px;
  font-family:var(--display);font-weight:600;font-size:clamp(10px,1.25vw,15px);color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.bet i{width:clamp(13px,1.7vw,20px);aspect-ratio:1;border-radius:50%;background:var(--chipc);border:2px dashed rgba(20,23,26,.6);box-sizing:border-box}
.bet.sel{outline:2px solid var(--gold)}

.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:50%;border:3px solid var(--c);display:inline-block}

.strip{display:flex;flex-direction:column;gap:8px}
.strip .lbl{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.step{font-family:var(--display);font-weight:600;font-size:15px;padding:5px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.step b{font-family:var(--body);font-size:12px;color:var(--muted)}
.step.now{background:var(--gold);color:#14171A;border-color:var(--gold)}
.step.now b{color:#14171A}
.step.out{opacity:.4;text-decoration:line-through}
.arrow{color:var(--muted);font-size:14px}

/* Panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel .big{font-family:var(--display);font-weight:700;font-size:52px;line-height:1;color:var(--c, var(--ink));min-width:0}
.panel h2{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.15;margin:0;text-transform:uppercase;text-wrap:balance}
.pill{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--c);color:#14171A}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{background:var(--room);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fact .k{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.fact .v{font-family:var(--display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.panel p{margin:0;color:var(--ink)}
.panel .tip{color:var(--muted)}
.panel .tip strong{color:var(--ink)}
.meter{display:flex;flex-direction:column;gap:6px}
.k2{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.k2 span{color:var(--ink);letter-spacing:.04em}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.bars i{height:10px;border-radius:3px;background:var(--line)}
.bars i.on{background:var(--c)}
.betbox{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:16px}
.betrow{display:flex;gap:8px;align-items:stretch}
.betrow .num{flex:1;width:auto;min-width:0;font-size:24px;padding:6px 12px}
.betrow .btn{width:46px;padding:0;font-size:22px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.quick .btn{padding:9px 6px;font-size:14px}
.quick .btn.on{border-color:var(--bad);color:var(--bad)}
.q{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.2;text-transform:uppercase;text-wrap:balance}
.feedback{font-weight:600;font-size:17px;padding:10px 12px;border-radius:10px;background:var(--room);border:1px solid var(--line)}
.feedback.ok{border-color:var(--good);color:var(--good)}
.feedback.no{border-color:var(--bad);color:var(--bad)}
.score{font-family:var(--display);font-size:20px;font-weight:600;color:var(--muted)}
.score b{color:var(--gold)}
footer{color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
footer img{width:34px;height:auto;opacity:.7}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<script>
(function(){
  const INFO = {
    "UTG":   {name:"Under the Gun", group:"early", desc:"Sits left of the big blind and is first to act before the flop. Everyone else still gets to act after you.", tip:"Play only your strongest hands: big pairs, A-K, A-Q.", w:1, wl:"Tightest"},
    "UTG+1": {name:"Under the Gun +1", group:"early", desc:"One seat after UTG. Still early, with most of the table left to act behind you.", tip:"Stay tight. Add a few more pairs and strong suited cards.", w:1, wl:"Tight"},
    "UTG+2": {name:"Under the Gun +2", group:"early", desc:"The last of the early seats. Still plenty of players behind you.", tip:"Tight, but slightly wider than UTG.", w:2, wl:"Tight"},
    "MP":    {name:"Middle Position", group:"middle", desc:"In the middle of the action. Some players have acted, some are still to come.", tip:"Open up a little: medium pairs and suited high cards.", w:2, wl:"Medium"},
    "LJ":    {name:"Lojack", group:"middle", desc:"Three seats right of the button. The start of the better seats.", tip:"A solid range. Add more suited aces and broadway cards.", w:3, wl:"Medium"},
    "HJ":    {name:"Hijack", group:"middle", desc:"Two seats right of the button. Only the cutoff, button and blinds are left behind you.", tip:"Start stealing the blinds with good, playable hands.", w:3, wl:"Medium-wide"},
    "CO":    {name:"Cutoff", group:"late", desc:"One seat right of the button. The second-best seat at the table.", tip:"Play wide and raise often. If the button folds, you act last after the flop.", w:4, wl:"Wide"},
    "BTN":   {name:"Button (dealer)", group:"late", desc:"Acts last on every street after the flop. You always see what everyone else does first.", tip:"The best seat at the table. Play the most hands here and attack the blinds.", w:5, wl:"Widest"},
    "SB":    {name:"Small Blind", group:"blinds", desc:"Posts half a big blind before the cards are dealt. Acts first after the flop, which makes it the hardest seat to play.", tip:"Be careful. You are out of position for the whole hand.", w:2, wl:"Careful"},
    "BB":    {name:"Big Blind", group:"blinds", desc:"Posts a full big blind before the cards are dealt. Acts last before the flop, then early after it.", tip:"You already paid, so you can defend with more hands when someone raises.", w:3, wl:"Defend often"},
    "BTN/SB":{name:"Button + Small Blind", group:"late", desc:"Heads-up, the button posts the small blind. It acts first before the flop and last after it.", tip:"Heads-up you play lots of hands. Position is everything.", w:5, wl:"Very wide"},
  };
  const GROUPS = {early:["Early position","var(--early)"], middle:["Middle position","var(--middle)"], late:["Late position","var(--gold)"], blinds:["Blinds","var(--blinds)"]};
  const REST = {0:[],1:["UTG"],2:["UTG","CO"],3:["UTG","HJ","CO"],4:["UTG","LJ","HJ","CO"],5:["UTG","UTG+1","LJ","HJ","CO"],6:["UTG","UTG+1","UTG+2","LJ","HJ","CO"],7:["UTG","UTG+1","UTG+2","MP","LJ","HJ","CO"]};

  const S = {n:9, btn:0, street:"pre", selected:"BTN", mode:"learn", playing:false, acting:null, quiz:null, score:0, asked:0,
             sb:50, bb:100, stack:10000, bets:[], folded:[], collected:0,
             board:[{r:"A",s:"♠"},{r:"10",s:"♥"},{r:"6",s:"♣"},{r:"K",s:"♦"},{r:"2",s:"♣"}], picking:null};
  const STREETS=["pre","flop","turn","river"], SNAME={pre:"Preflop",flop:"Flop",turn:"Turn",river:"River"}, SHOWN={pre:0,flop:3,turn:4,river:5};
  const RANKS=["A","K","Q","J","10","9","8","7","6","5","4","3","2"], SUITS=["♠","♥","♦","♣"];
  const isRed = c => c.s==="♥"||c.s==="♦";
  const same = (a,b) => a&&b&&a.r===b.r&&a.s===b.s;
  S.hands = []; S.hideHands = false; S.showOrder = false; S.aboutOpen = true;
  const cardTxt = c => c.r+c.s;
  const fullDeck = () => { const a=[]; SUITS.forEach(s=>RANKS.forEach(r=>a.push({r,s}))); return a; };
  const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

  // hand evaluation
  const RV={A:14,K:13,Q:12,J:11,"10":10,"9":9,"8":8,"7":7,"6":6,"5":5,"4":4,"3":3,"2":2};
  const RN={14:"Ace",13:"King",12:"Queen",11:"Jack",10:"Ten",9:"Nine",8:"Eight",7:"Seven",6:"Six",5:"Five",4:"Four",3:"Three",2:"Two"};
  const pl = r => r===6 ? "Sixes" : RN[r]+"s";
  function score5(cs){
    const v=cs.map(c=>RV[c.r]).sort((a,b)=>b-a), flush=cs.every(c=>c.s===cs[0].s), uniq=new Set(v);
    let sh=0; if(uniq.size===5){ if(v[0]-v[4]===4) sh=v[0]; else if(v.join()==="14,5,4,3,2") sh=5; }
    const cnt={}; v.forEach(x=>cnt[x]=(cnt[x]||0)+1);
    const g=Object.entries(cnt).map(([r,c])=>[c,+r]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]), k=g.map(x=>x[1]);
    if(sh&&flush) return [8,sh]; if(g[0][0]===4) return [7,...k]; if(g[0][0]===3&&g[1][0]===2) return [6,...k];
    if(flush) return [5,...v]; if(sh) return [4,sh]; if(g[0][0]===3) return [3,...k];
    if(g[0][0]===2&&g[1][0]===2) return [2,...k]; if(g[0][0]===2) return [1,...k]; return [0,...v];
  }
  const cmp=(a,b)=>{ for(let i=0;i<Math.max(a.length,b.length);i++){ const d=(a[i]||0)-(b[i]||0); if(d) return d; } return 0; };
  function best(cards){
    let top=null; const n=cards.length;
    for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)for(let c=b+1;c<n;c++)for(let d=c+1;d<n;d++)for(let e=d+1;e<n;e++){
      const s=score5([cards[a],cards[b],cards[c],cards[d],cards[e]]); if(!top||cmp(s,top)>0) top=s; }
    return top;
  }
  function handName(s){
    switch(s[0]){
      case 8: return s[1]===14 ? "Royal flush" : "Straight flush, "+RN[s[1]]+" high";
      case 7: return "Four of a kind, "+pl(s[1]);
      case 6: return "Full house, "+pl(s[1])+" full of "+pl(s[2]);
      case 5: return "Flush, "+RN[s[1]]+" high";
      case 4: return "Straight, "+RN[s[1]]+" high";
      case 3: return "Three of a kind, "+pl(s[1]);
      case 2: return "Two pair, "+pl(s[1])+" and "+pl(s[2]);
      case 1: return "Pair of "+pl(s[1]);
      default: return "High card, "+RN[s[1]];
    }
  }
  const shownBoard = () => S.board.slice(0, SHOWN[S.street]).filter(Boolean);
  function describe(seat){
    const h=S.hands[seat]; if(!h||!h[0]||!h[1]) return null;
    const b=shownBoard();
    if(b.length>=3) return handName(best([...h, ...b]));
    if(h[0].r===h[1].r) return "Pocket "+pl(RV[h[0].r]);
    const [x,y]=[...h].sort((a,b)=>RV[b.r]-RV[a.r]);
    return x.r+"-"+y.r+(x.s===y.s?" suited":" offsuit");
  }
  function showdownWinners(){
    if(S.street!=="river" || shownBoard().length<5) return [];
    const live=[]; for(let s=0;s<S.n;s++){ const h=S.hands[s]; if(!S.folded[s] && h && h[0] && h[1]) live.push([s, best([...h, ...shownBoard()])]); }
    if(live.length<2) return [];
    let top=live[0][1]; live.forEach(x=>{ if(cmp(x[1],top)>0) top=x[1]; });
    return live.filter(x=>cmp(x[1],top)===0).map(x=>x[0]);
  }
  function usedCards(except){
    const u=[]; S.board.forEach((c,i)=>{ if(c && !(except.t==="b"&&except.i===i)) u.push(c); });
    S.hands.forEach((h,s)=>(h||[]).forEach((c,i)=>{ if(c && !(except.t==="h"&&except.seat===s&&except.i===i)) u.push(c); }));
    return u;
  }
  const $ = id => document.getElementById(id);
  const table = $("table");
  const fmt = v => Math.round(v).toLocaleString("en-US");
  const inBB = v => { const x = v / S.bb; return (Math.round(x*10)/10).toLocaleString("en-US"); };

  function labels(n){ return n===2 ? ["BTN/SB","BB"] : ["BTN","SB","BB", ...REST[n-3]]; }
  function seatOf(label){ const L=labels(S.n); const j=L.indexOf(label); return j<0?null:(S.btn+j)%S.n; }
  function labelOf(seat){ const L=labels(S.n); return L[(seat - S.btn + S.n)%S.n]; }
  function order(street){
    const L=labels(S.n);
    if(S.n===2) return street==="pre" ? ["BTN/SB","BB"] : ["BB","BTN/SB"];
    if(street==="pre") return [...L.slice(3), "BTN","SB","BB"];
    return ["SB","BB", ...L.slice(3), "BTN"];
  }
  function geom(seat, rx, ry){
    const a = (90 - 180/S.n + seat*360/S.n) * Math.PI/180;
    return {x:50 + rx*Math.cos(a), y:50 + ry*Math.sin(a)};
  }
  const ord = n => { const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };

  function newHand(clearCards=true){
    if(clearCards || S.hands.length!==S.n) S.hands = Array(S.n).fill(null).map(()=>[null,null]);
    S.bets = Array(S.n).fill(0); S.folded = Array(S.n).fill(false); S.collected = 0; S.street = "pre"; S.invested = Array(S.n).fill(0);
    const sbSeat = seatOf(S.n===2 ? "BTN/SB" : "SB"), bbSeat = seatOf("BB");
    S.bets[sbSeat] = Math.min(S.sb, S.stack); S.bets[bbSeat] = Math.min(S.bb, S.stack);
  }
  const cap = seat => S.stack - (S.invested[seat]||0);
  const maxBet = () => Math.max(0, ...S.bets);
  const pot = () => S.collected + S.bets.reduce((a,b)=>a+b,0);
  function goStreet(st){
    if(S.playing) return;
    if(STREETS.indexOf(st) > STREETS.indexOf(S.street)){ S.collected += S.bets.reduce((a,b)=>a+b,0); S.bets.forEach((v,i)=>S.invested[i]+=v); S.bets = Array(S.n).fill(0); }
    S.street = st; render();
  }
  function chipColor(v){ const r=v/S.bb; return r>=20?"#7D96E6": r>=5?"#4FB5A5": r>=1.5?"#E8C14F":"#E3876A"; }

  function renderControls(){
    $("players").value=S.n;
    document.querySelectorAll("#streetSeg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.street===S.street));
    document.querySelectorAll("#modeSeg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.mode===S.mode));
    $("playBtn").disabled = S.playing || S.mode==="quiz";
    $("toggleHands").textContent = S.hideHands ? "Show cards" : "Hide cards"; $("toggleHands").setAttribute("aria-pressed", S.hideHands);
    ["dealHands","clearHands","toggleHands","toggleOrder","randBoard","clearBoard","nextHand"].forEach(id=>$(id).disabled = S.playing || S.mode==="quiz");
    $("nextStreet").disabled = S.playing || S.mode==="quiz" || S.street==="river";
    $("toggleOrder").setAttribute("aria-pressed", S.showOrder);
    $("players").disabled = S.playing;
  }

  function renderBoard(){
    const b=$("board"); b.innerHTML="";
    const shown = SHOWN[S.street], slotName=["Flop card 1","Flop card 2","Flop card 3","Turn","River"];
    for(let i=0;i<5;i++){
      if(i===3||i===4){ const g=document.createElement("span"); g.className="boardgap"; b.appendChild(g); }
      const c=document.createElement("button"); c.className="card"; c.id="slot-"+i;
      const cd=S.board[i];
      if(cd){ c.classList.add("up"); if(isRed(cd)) c.classList.add("red"); c.textContent=cd.r+cd.s; }
      else c.textContent="+";
      if(i>=shown) c.classList.add("later");
      c.setAttribute("aria-label", slotName[i]+": "+(cd?cd.r+cd.s:"empty")+". Choose card");
      c.onclick=()=>openPicker(i);
      b.appendChild(c); }
    $("streetLabel").textContent = SNAME[S.street];
    const ns=$("nextStreet");
    ns.textContent = S.street==="pre"?"Deal flop →": S.street==="flop"?"Deal turn →": S.street==="turn"?"Deal river →":"River dealt";
    const quiz = S.mode==="quiz";
    $("pot").hidden = quiz;
    $("pot").innerHTML = `Pot <span>${fmt(pot())}</span>`;
  }

  function renderTable(){
    renderBoard();
    table.querySelectorAll(".seat,.chip,.bet,.hole").forEach(e=>e.remove());
    const ordr = order(S.street);
    const quiz = S.mode==="quiz";
    for(let s=0;s<S.n;s++){
      const lab = labelOf(s), inf = INFO[lab], g = GROUPS[inf.group];
      const p = geom(s, 44, 41);
      const el = document.createElement("button"); el.className="seat"; el.id="seat-"+s;
      el.style.left=p.x+"%"; el.style.top=p.y+"%";
      const reveal = !quiz || (S.quiz && S.quiz.answered);
      const winners = quiz ? [] : showdownWinners();
      el.style.setProperty("--c", reveal ? g[1] : "var(--line)");
      el.setAttribute("aria-label", reveal ? inf.name + (quiz?"":", bet "+fmt(S.bets[s])) : "Seat "+(s+1));
      el.innerHTML = reveal ? `<span class="pos">${lab}</span>` : `<span class="pos">?</span>`;
      if(!quiz){
        if(lab===S.selected) el.classList.add("selected");
        if(lab===S.acting) el.classList.add("acting");
        if(S.folded[s]) el.classList.add("folded");
        if(S.showOrder || S.playing){ const o=document.createElement("span"); o.className="order"; o.textContent=ordr.indexOf(lab)+1; el.appendChild(o); }
      } else if(S.quiz && S.quiz.answered){
        if(lab===S.quiz.answer) el.classList.add("right");
        else if(s===S.quiz.picked) el.classList.add("wrong");
      }
      if(!quiz && winners.includes(s)){ const w=document.createElement("span"); w.className="win"; w.textContent="BEST HAND"; el.appendChild(w); }
      el.onclick=()=>onSeat(s);
      table.appendChild(el);
      // hole cards
      if(!quiz && (S.hands[s]||[]).some(Boolean)){
        const hp = geom(s, 34.5, 29.5), h = (S.hands[s] || [null,null]).filter(Boolean);
        const box=document.createElement("div"); box.className="hole"+(S.folded[s]?" dim":""); box.style.left=hp.x+"%"; box.style.top=hp.y+"%";
        h.forEach((cd,i)=>{ const b=document.createElement("button");
          if(S.hideHands){ b.className="hc back"; }
          else { b.className="hc"+(isRed(cd)?" red":""); b.innerHTML=`<span>${cd.r}</span><span>${cd.s}</span>`; }
          b.setAttribute("aria-label", lab+" card "+(i+1)+": "+(cd? (S.hideHands?"hidden":cardTxt(cd)) : "empty")+". Choose card");
          b.onclick=()=>onSeat(s); box.appendChild(b); });
        table.appendChild(box);
      }
      // bet in front of the seat
      if(!quiz && S.bets[s]>0){
        const bp = geom(s, 26, 20.5);
        const b=document.createElement("button"); b.className="bet"+(lab===S.selected?" sel":""); b.style.left=bp.x+"%"; b.style.top=bp.y+"%";
        b.style.setProperty("--chipc", chipColor(S.bets[s]));
        b.innerHTML=`<i></i>${fmt(S.bets[s])}`; b.setAttribute("aria-label", lab+" bet "+fmt(S.bets[s]));
        b.onclick=()=>onSeat(s); table.appendChild(b);
      }
    }
    const ds = seatOf(S.n===2?"BTN/SB":"BTN");
    const dp = geom(ds + 0.42, 33, 27.5);
    const c=document.createElement("div"); c.className="chip d"; c.textContent="D"; c.setAttribute("aria-hidden","true");
    c.style.left=dp.x+"%"; c.style.top=dp.y+"%"; table.appendChild(c);
    renderSteps(ordr);
  }

  function render(){ renderControls(); renderTable(); renderPanel(); }

  function renderSteps(ordr){
    $("stripLbl").textContent = S.street==="pre" ? "Action order preflop" : "Action order on the "+SNAME[S.street].toLowerCase();
    const st=$("steps"); st.innerHTML="";
    ordr.forEach((lab,i)=>{ if(i){ const a=document.createElement("span"); a.className="arrow"; a.textContent="→"; st.appendChild(a); }
      const s=seatOf(lab);
      const d=document.createElement("span"); d.className="step"+(lab===S.acting?" now":"")+(S.mode!=="quiz"&&S.folded[s]?" out":""); d.innerHTML=`<b>${i+1}</b>${lab}`; st.appendChild(d); });
  }

  function betInfoHTML(seat){
    const bet=S.bets[seat], toCall=Math.max(0, maxBet()-bet);
    return `To call <span>${fmt(Math.min(toCall, cap(seat)-bet))}</span> · Behind <span>${fmt(cap(seat)-bet)}</span> · Pot <span>${fmt(pot())}</span>`;
  }

  function renderPanel(){
    const P=$("panel");
    if(S.mode==="quiz"){
      const q=S.quiz;
      let fb="";
      if(q.answered){ fb = q.correct ? `<div class="feedback ok">Correct! That’s the ${INFO[q.answer].name}.</div>`
                                     : `<div class="feedback no">Not quite. The right seat is ${q.answer} (${INFO[q.answer].name}), shown in green.</div>`; }
      P.style.removeProperty("--c");
      P.innerHTML = `<span class="eyebrow">Quiz · ${S.n} players</span>
        <div class="q">${q.text}</div>
        <p class="tip">Only the dealer button is shown. Work out the rest from there.</p>
        ${fb}
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
          <span class="score">Score <b>${S.score}</b> / ${S.asked}</span>
          <button class="btn primary" id="nextQ" ${q.answered?"":"disabled"}>Next question →</button>
        </div>`;
      $("nextQ").onclick=()=>{ newQuestion(true); render(); };
      return;
    }
    const lab=S.selected, inf=INFO[lab], g=GROUPS[inf.group], seat=seatOf(lab);
    const pre=order("pre"), post=order("post");
    const pi=pre.indexOf(lab)+1, po=post.indexOf(lab)+1;
    const say=(i)=> i===1?"First": i===S.n?"Last": ord(i);
    const bet=S.bets[seat], toCall=maxBet()-bet;
    P.style.setProperty("--c", g[1]);
    P.innerHTML = `<div class="phead"><div class="big">${lab}</div><div><h2>${inf.name}</h2><span class="pill">${g[0]}</span></div></div>
      <div class="facts">
        <div class="fact"><span class="k">Preflop</span><span class="v">${say(pi)} of ${S.n}</span></div>
        <div class="fact"><span class="k">After the flop</span><span class="v">${say(po)} of ${S.n}</span></div>
      </div>
      <div class="sec">
        <div class="k2">Cards</div>
        <div class="holeRow">
          ${[0,1].map(i=>{ const cd=(S.hands[seat]||[])[i];
            if(!cd) return `<button class="cl empty" id="hole${i}" aria-label="Choose card ${i+1}">+</button>`;
            if(S.hideHands) return `<button class="cl back" id="hole${i}" aria-label="Card ${i+1} hidden. Choose card"></button>`;
            return `<button class="cl${isRed(cd)?" red":""}" id="hole${i}" aria-label="Card ${i+1}: ${cardTxt(cd)}. Choose card"><span>${cd.r}</span><span>${cd.s}</span></button>`; }).join("")}
          <div class="besthand"><span class="k">${shownBoard().length>=3?"Best hand":"Starting hand"}</span>
            <span class="v">${S.hideHands ? "Hidden" : (describe(seat) || "Tap a card to choose it")}</span>
            ${showdownWinners().includes(seat) ? `<span class="k" style="color:var(--good)">Wins at showdown</span>` : ""}</div>
        </div>
      </div>
      <div class="sec">
        <div class="k2">Bet <span id="betBB">${inBB(bet)} BB</span></div>
        <div class="betrow">
          <button class="btn" id="betMinus" aria-label="Lower bet by one big blind">−</button>
          <input class="num" id="betInput" type="number" min="0" max="${cap(seat)}" step="${S.bb}" value="${bet}" inputmode="numeric" aria-label="Bet amount for ${lab}">
          <button class="btn" id="betPlus" aria-label="Raise bet by one big blind">+</button>
        </div>
        <div class="quick">
          <button class="btn" id="qCall">${toCall>0?"Call "+fmt(Math.min(maxBet(), cap(seat))):"Check"}</button>
          <button class="btn" id="qRaise">${maxBet()===0&&S.street!=="pre" ? "Bet ½ pot ("+fmt(raiseTarget())+")" : (maxBet()===0?"Bet ":"Raise to ")+fmt(raiseTarget())}</button>
          <button class="btn" id="qAll">All-in</button>
          <button class="btn ${S.folded[seat]?"on":""}" id="qFold">${S.folded[seat]?"Folded (undo)":"Fold"}</button>
        </div>
        <div class="k2" id="betInfo" style="justify-content:flex-start;flex-wrap:wrap">${betInfoHTML(seat)}</div>
      </div>
      <details class="about sec" id="about" ${S.aboutOpen?"open":""}><summary>About this seat</summary>
        <div style="display:flex;flex-direction:column;gap:10px">
        <p>${inf.desc}</p>
        <p class="tip"><strong>How to play it:</strong> ${inf.tip}</p>
        <div class="meter"><div class="k2">Hands to play <span>${inf.wl}</span></div>
          <div class="bars">${[1,2,3,4,5].map(i=>`<i class="${i<=inf.w?"on":""}"></i>`).join("")}</div></div></div>
      </details>`;
    $("about").addEventListener("toggle", e=>{ S.aboutOpen=e.target.open; });

    const setBet=(v, full)=>{ v = Math.max(0, Math.min(cap(seat), Math.round(Number(v)||0))); S.bets[seat]=v; if(v>0) S.folded[seat]=false;
      if(full){ render(); } else { renderTable(); $("betBB").textContent=inBB(v)+" BB"; $("betInfo").innerHTML=betInfoHTML(seat); } };
    $("betInput").addEventListener("input", e=>setBet(e.target.value, false));
    $("betInput").addEventListener("change", e=>setBet(e.target.value, true));
    $("betMinus").onclick=()=>setBet(bet - S.bb, true);
    $("betPlus").onclick=()=>setBet(bet + S.bb, true);
    $("qCall").onclick=()=>setBet(Math.max(bet, maxBet()), true);
    $("qRaise").onclick=()=>setBet(raiseTarget(), true);
    $("qAll").onclick=()=>setBet(cap(seat), true);
    $("hole0").onclick=()=>openPicker({t:"h", seat, i:0});
    $("hole1").onclick=()=>openPicker({t:"h", seat, i:1});
    $("qFold").onclick=()=>{ S.folded[seat]=!S.folded[seat]; render(); };
  }
  function raiseTarget(){ const m=maxBet();
    if(m===0 && S.street!=="pre") return Math.min(S.stack, Math.max(S.bb, Math.round(pot()/2)));
    return Math.min(S.stack, m>0 ? m*3 : S.bb*3); }

  // card picker
  // target: a board slot number, or {t:"h", seat, i} for a player's card
  function getCard(t){ return t.t==="b" ? S.board[t.i] : (S.hands[t.seat]||[])[t.i]; }
  function setCard(t,c){ if(t.t==="b") S.board[t.i]=c; else { if(!S.hands[t.seat]) S.hands[t.seat]=[null,null]; S.hands[t.seat][t.i]=c; } }
  function openPicker(target){
    if(S.playing) return;
    const t = typeof target==="number" ? {t:"b", i:target} : target;
    S.picking=t;
    const names=["flop card 1","flop card 2","flop card 3","the turn","the river"];
    $("pickTitle").textContent = t.t==="b" ? "Choose "+names[t.i] : "Choose "+labelOf(t.seat)+"’s "+(t.i===0?"first":"second")+" card";
    const used=usedCards(t), cur=getCard(t);
    const deck=$("deck"); deck.innerHTML="";
    SUITS.forEach(s=>RANKS.forEach(r=>{
      const c={r,s}; const b=document.createElement("button"); b.className="pc"+(isRed(c)?" red":"");
      if(same(cur,c)) b.classList.add("cur");
      b.disabled = used.some(x=>same(x,c)); b.innerHTML=`<span>${r}</span><span>${s}</span>`; b.setAttribute("aria-label", r+" of "+({"♠":"spades","♥":"hearts","♦":"diamonds","♣":"clubs"})[s]);
      b.onclick=()=>{ setCard(t,c); closePicker(); render(); };
      deck.appendChild(b); }));
    $("picker").hidden=false; $("pickClose").focus();
  }
  function closePicker(){ $("picker").hidden=true; const t=S.picking; S.picking=null; if(t && t.t==="b"){ const s=$("slot-"+t.i); if(s) s.focus(); } }
  $("pickClose").onclick=closePicker;
  $("pickRemove").onclick=()=>{ if(S.picking) setCard(S.picking, null); closePicker(); render(); };
  $("dealHands").onclick=()=>{ if(S.playing) return; const d=shuffle(fullDeck().filter(c=>!S.board.some(b=>same(b,c))));
    S.hands=Array(S.n).fill(null).map((_,s)=> S.folded[s] ? [null,null] : [d.pop(), d.pop()]); S.hideHands=false; render(); };
  $("clearHands").onclick=()=>{ S.hands=Array(S.n).fill(null).map(()=>[null,null]); render(); };
  $("toggleHands").onclick=()=>{ S.hideHands=!S.hideHands; render(); };
  $("picker").addEventListener("click", e=>{ if(e.target.id==="picker") closePicker(); });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("picker").hidden) closePicker(); });
  $("randBoard").onclick=()=>{ const held=[]; S.hands.forEach(h=>(h||[]).forEach(c=>c&&held.push(c)));
    S.board=shuffle(fullDeck().filter(c=>!held.some(x=>same(x,c)))).slice(0,5); render(); };
  $("clearBoard").onclick=()=>{ S.board=[null,null,null,null,null]; render(); };
  $("nextStreet").onclick=()=>{ if(S.playing) return; const k=STREETS.indexOf(S.street); if(k<3) goStreet(STREETS[k+1]); };
  $("players").addEventListener("change", e=>{ if(S.playing) return; const n=+e.target.value; S.n=n; S.btn=S.btn%n; if(!labels(n).includes(S.selected)) S.selected=labels(n)[0]; newHand(); if(S.mode==="quiz") newQuestion(false); render(); });
  $("setupBtn").onclick=()=>{ const open=$("setup").hidden; $("setup").hidden=!open; $("setupBtn").setAttribute("aria-expanded", open); };
  $("toggleOrder").onclick=()=>{ S.showOrder=!S.showOrder; render(); };

  function onSeat(s){
    if(S.mode==="learn"){ S.selected=labelOf(s); render(); return; }
    const q=S.quiz; if(q.answered) return;
    q.answered=true; q.picked=s; q.correct = labelOf(s)===q.answer; S.asked++; if(q.correct) S.score++;
    render();
  }

  function newQuestion(moveBtn){
    if(moveBtn){ S.btn = Math.floor(Math.random()*S.n); newHand(); }
    const L=labels(S.n), pre=order("pre"), post=order("post");
    const pool=[
      ["Tap the seat that acts first before the flop", pre[0]],
      ["Tap the seat that acts first after the flop", post[0]],
      ["Tap the seat that acts last before the flop", pre[pre.length-1]],
      ["Tap the seat that acts last after the flop", post[post.length-1]],
      ["Tap the big blind", "BB"],
    ];
    if(S.n>2){ pool.push(["Tap the small blind","SB"]); pool.push(["Tap the best seat at the table","BTN"]); }
    if(S.n>3) pool.push(["Tap Under the Gun (UTG)","UTG"]);
    if(L.includes("CO")) pool.push(["Tap the cutoff","CO"]);
    if(L.includes("HJ")) pool.push(["Tap the hijack","HJ"]);
    if(L.includes("LJ")) pool.push(["Tap the lojack","LJ"]);
    let pick; do { pick = pool[Math.floor(Math.random()*pool.length)]; } while(S.quiz && pool.length>1 && pick[0]===S.quiz.text && pick[1]===S.quiz.answer);
    S.quiz={text:pick[0], answer:pick[1], answered:false, picked:null, correct:false};
  }

  function play(){
    if(S.playing) return; S.playing=true;
    const seq=order(S.street).filter(l=>!S.folded[seatOf(l)]); let i=0;
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const tick=()=>{ if(i<seq.length){ S.acting=seq[i++]; render(); setTimeout(tick, reduce?900:750); }
      else { S.acting=null; S.playing=false; render(); } };
    tick();
  }

  const readNum=(id, min, fallback)=>{ const v=Math.round(Number($(id).value)); return isFinite(v)&&v>=min ? v : fallback; };
  $("sbIn").addEventListener("change", ()=>{ S.sb=readNum("sbIn",0,S.sb); $("sbIn").value=S.sb; newHand(false); render(); });
  $("bbIn").addEventListener("change", ()=>{ S.bb=readNum("bbIn",1,S.bb); $("bbIn").value=S.bb; newHand(false); render(); });
  $("stackIn").addEventListener("change", ()=>{ S.stack=readNum("stackIn",1,S.stack); $("stackIn").value=S.stack; newHand(false); render(); });
  $("nextHand").onclick=()=>{ if(S.playing) return; S.btn=(S.btn+1)%S.n; newHand(); render(); };
  $("playBtn").onclick=play;
  document.querySelectorAll("#streetSeg button").forEach(b=>b.onclick=()=>goStreet(b.dataset.street));
  document.querySelectorAll("#modeSeg button").forEach(b=>b.onclick=()=>{ if(S.playing) return; S.mode=b.dataset.mode; if(S.mode==="quiz"){ S.score=0; S.asked=0; newQuestion(false);} render(); });

  newHand();
  // example hand so the table opens in a working state: UTG raises, CO calls
  (function(){ const u=seatOf("UTG"), c=seatOf("CO"); if(u!==null){ S.bets[u]=S.bb*3; } if(c!==null){ S.bets[c]=S.bb*3; }
    if(u!==null) S.hands[u]=[{r:"Q",s:"♠"},{r:"Q",s:"♥"}]; if(c!==null) S.hands[c]=[{r:"A",s:"♦"},{r:"J",s:"♣"}]; })();
  render();
})();
</script>

</body></html>
